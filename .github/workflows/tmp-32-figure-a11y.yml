name: Temporary #32 replay figure accessibility

on:
  push:
    branches:
      - codex/32-replay-figure-accessibility

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: codex/32-replay-figure-accessibility
          fetch-depth: 0
          persist-credentials: true

      - name: Apply replay accessibility patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"missing expected block in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Iberian BESS: descriptive relationships plus redundant hatch/position encoding.
          path = 'results/iberian-bess-policy-challenge/run/index.html'
          replace_once(path,
              '<svg id="dispatch-chart" viewBox="0 0 900 430" role="img" aria-label="Dispatch trace chart"></svg>',
              '<svg id="dispatch-chart" viewBox="0 0 900 430" role="img" aria-label="Dispatch trace chart" aria-describedby="dispatch-chart-summary"></svg>\n            <p class="storage-visually-hidden" id="dispatch-chart-summary">The selected frozen 24-hour scenario is shown with a solid price line, a dashed state-of-charge line, hatched charge bars below the zero-dispatch axis, and solid discharge bars above it. Profit and uplift are scenario-level replay values. This offline benchmark excludes intraday, reserves, imbalance, taxes, grid and portfolio effects.</p>')
          replace_once(path,
              '<svg id="score-chart" viewBox="0 0 620 260" role="img" aria-label="Score trace"></svg>',
              '<svg id="score-chart" viewBox="0 0 620 260" role="img" aria-label="Score trace" aria-describedby="score-chart-summary"></svg>\n            <p class="storage-visually-hidden" id="score-chart-summary">The score trace labels every published checkpoint numerically and marks the accepted endpoint with a larger marker. Lower is better. The score is the frozen weighted benchmark objective and is not a live-trading or production-performance claim.</p>')

          path = 'results/iberian-bess-policy-challenge/run/surface.css'
          replace_once(path,
              '#dispatch-chart,\n#score-chart {',
              '.storage-visually-hidden {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n#dispatch-chart,\n#score-chart {')
          replace_once(path,
              '.storage-charge-bar {\n  fill: color-mix(in srgb, var(--text) 34%, transparent);\n}',
              '.storage-charge-hatch-line {\n  stroke: color-mix(in srgb, var(--text) 70%, transparent);\n  stroke-width: 1.2;\n}\n\n.storage-charge-bar {\n  fill: url(#storage-charge-hatch);\n  stroke: color-mix(in srgb, var(--text) 58%, transparent);\n  stroke-width: 0.8;\n}')

          path = 'results/iberian-bess-policy-challenge/run/surface.js'
          replace_once(path,
              '  const scoreChart = document.getElementById("score-chart");\n  const code = document.getElementById("candidate-code");',
              '  const scoreChart = document.getElementById("score-chart");\n  const dispatchSummary = document.getElementById("dispatch-chart-summary");\n  const scoreSummary = document.getElementById("score-chart-summary");\n  const code = document.getElementById("candidate-code");')
          replace_once(path,
              '    scoreChart.innerHTML = `\n      <path class="storage-grid"',
              '    scoreChart.setAttribute("aria-label", `Score trace from ${fmt(data.metrics.seed, 1)} baseline to ${fmt(data.metrics.best, 1)} accepted; lower is better.`);\n    if (scoreSummary) {\n      scoreSummary.textContent = `The frozen weighted benchmark score falls from ${fmt(data.metrics.seed, 2)} at baseline to ${fmt(data.metrics.best, 2)} at the accepted endpoint. Every checkpoint is numerically labelled and the accepted endpoint uses the largest marker. ${data.result?.website?.score_note ?? "This is an offline benchmark, not a live-trading claim."}`;\n    }\n    scoreChart.innerHTML = `\n      <path class="storage-grid"')
          replace_once(path,
              '    dispatchChart.innerHTML = `\n      <path class="storage-grid"',
              '    dispatchChart.setAttribute("aria-label", `${scenario.scenario_id} dispatch trace: solid price line, dashed state-of-charge line, hatched charge bars below zero, and solid discharge bars above zero.`);\n    if (dispatchSummary) {\n      dispatchSummary.textContent = `${scenario.scenario_id} (${scenario.split}) reports candidate profit €${fmt(comparison.candidate_profit_eur)}, baseline profit €${fmt(comparison.baseline_profit_eur)}, uplift €${fmt(comparison.uplift_vs_comparison_baseline_eur)}, and regret €${fmt(comparison.regret_eur)}. Charge is hatched and plotted below the zero-dispatch axis; discharge is solid and plotted above it; price is a solid line and state of charge is dashed. This is a frozen 24-hour offline scenario and excludes intraday, reserves, imbalance, taxes, grid and portfolio effects.`;\n    }\n    dispatchChart.innerHTML = `\n      <defs>\n        <pattern id="storage-charge-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">\n          <line class="storage-charge-hatch-line" x1="0" y1="0" x2="0" y2="6"></line>\n        </pattern>\n      </defs>\n      <path class="storage-grid"')

          # Qubit routing: descriptive relationships and accepted diamond distinct from baseline circle.
          path = 'results/qubit-routing-lightsabre/run/index.html'
          replace_once(path,
              '<svg class="qubit-run-score-svg" id="score-svg" viewBox="0 0 460 250" role="img" aria-label="Animated weighted CNOT reduction trace"></svg>',
              '<svg class="qubit-run-score-svg" id="score-svg" viewBox="0 0 460 250" role="img" aria-label="Animated weighted CNOT reduction trace" aria-describedby="qubit-score-summary"></svg>\n                <p class="qubit-run-visually-hidden" id="qubit-score-summary">Scored candidates are dots and the best-so-far path is a line. The baseline is a circle while the final accepted candidate is a diamond, so identity does not depend on color. The positive readout represents lower added-CNOT objective on the frozen public routing portfolio; it is not a hardware-runtime claim.</p>')
          replace_once(path,
              '<svg class="qubit-run-circuit-svg" id="circuit-svg" viewBox="0 0 640 330" role="img" aria-label="Animated qubit routing circuit"></svg>',
              '<svg class="qubit-run-circuit-svg" id="circuit-svg" viewBox="0 0 640 330" role="img" aria-label="Animated qubit routing circuit" aria-describedby="qubit-circuit-summary"></svg>\n                <p class="qubit-run-visually-hidden" id="qubit-circuit-summary">CNOT and SWAP operations use different geometric gate symbols and text labels; the animation is a representative routing-case replay rather than a hardware timing trace.</p>')
          replace_once(path,
              '<svg class="qubit-run-topology-svg" id="topology-svg" viewBox="0 0 460 250" role="img" aria-label="Animated topology split"></svg>',
              '<svg class="qubit-run-topology-svg" id="topology-svg" viewBox="0 0 460 250" role="img" aria-label="Animated topology split" aria-describedby="qubit-topology-summary"></svg>\n                <p class="qubit-run-visually-hidden" id="qubit-topology-summary">Topology rows are text-labelled Q20, Willow and Heron-FEZ and report added-CNOT counts directly. Lower added-CNOT count is better; row identity and values remain readable without color.</p>')

          path = 'results/qubit-routing-lightsabre/run/surface.css'
          replace_once(path,
              '.qubit-run-visual {',
              '.qubit-run-visually-hidden {\n  position: absolute;\n  width: 1px;\n  height: 1px;\n  padding: 0;\n  margin: -1px;\n  overflow: hidden;\n  clip: rect(0, 0, 0, 0);\n  white-space: nowrap;\n  border: 0;\n}\n\n.qubit-run-visual {')
          replace_once(path,
              '.qubit-run-accepted-ring {\n  fill: var(--bg);\n  stroke: var(--accent);\n  stroke-width: 2;\n}',
              '.qubit-run-accepted-ring,\n.qubit-run-accepted-diamond {\n  fill: var(--bg);\n  stroke: var(--accent);\n  stroke-width: 2;\n}\n\n.qubit-run-accepted-diamond {\n  stroke-linejoin: round;\n}')

          path = 'results/qubit-routing-lightsabre/run/surface.js'
          replace_once(path,
              '<circle class="qubit-run-accepted-ring" cx="330" cy="0" r="4" />',
              '<rect class="qubit-run-accepted-diamond" x="326" y="-4" width="8" height="8" transform="rotate(45 330 0)" />')
          replace_once(path,
              '${acceptedVisible ? `<circle class="qubit-run-accepted-ring" cx="${xAt(accepted.index ?? indexEnd).toFixed(1)}" cy="${yAt(accepted.weighted_cnot_delta).toFixed(1)}" r="4.8" />` : ""}',
              '${acceptedVisible ? `<rect class="qubit-run-accepted-diamond" x="${(xAt(accepted.index ?? indexEnd) - 4.2).toFixed(1)}" y="${(yAt(accepted.weighted_cnot_delta) - 4.2).toFixed(1)}" width="8.4" height="8.4" transform="rotate(45 ${xAt(accepted.index ?? indexEnd).toFixed(1)} ${yAt(accepted.weighted_cnot_delta).toFixed(1)})" />` : ""}')

          # RCPSP already carries hatching/dashes/labels; bind those visuals to explicit textual summaries.
          path = 'results/rcpsp-psplib-j30/run/index.html'
          replace_once(path,
              'aria-label="Best-so-far RCPSP acceptance objective"\n                ></svg>',
              'role="img"\n                  aria-label="Best-so-far RCPSP acceptance objective"\n                  aria-describedby="rcpsp-score-summary"\n                ></svg>\n                <p class="rcpsp-visually-hidden" id="rcpsp-score-summary">Candidate dots and the best-so-far line are accompanied by numeric axes and distinct baseline, current and accepted markers. Lower score is better under the frozen 80-instance PSPLIB J30 contract, and feasibility is mandatory.</p>')
          replace_once(path,
              'aria-label="Animated Gantt and resource view for the current checkpoint"\n                ></svg>',
              'role="img"\n                  aria-label="Animated Gantt and resource view for the current checkpoint"\n                  aria-describedby="rcpsp-dispatch-summary"\n                ></svg>\n                <p class="rcpsp-visually-hidden" id="rcpsp-dispatch-summary">The checkpoint view uses task labels, lane position, makespan markers and hatched excess regions in addition to color. It is a deterministic representative schedule/resource replay under the frozen evaluation contract.</p>')
          replace_once(path,
              'aria-label="Animated portfolio gap view for the current checkpoint"\n                ></svg>',
              'role="img"\n                  aria-label="Animated portfolio gap view for the current checkpoint"\n                  aria-describedby="rcpsp-gap-summary"\n                ></svg>\n                <p class="rcpsp-visually-hidden" id="rcpsp-gap-summary">Portfolio rows carry instance labels, baseline/current markers, numeric gaps and a dashed accepted guide, so the comparison remains interpretable without color. The public result covers the frozen 80-instance PSPLIB J30 subset, not all RCPSP instances.</p>')

          # Regression contract for the source-owned replay surfaces.
          test_path = Path('tests/test_replay_figure_accessibility.py')
          test_path.write_text(r'''from pathlib import Path
import unittest

ROOT = Path(__file__).resolve().parents[1]

class ReplayFigureAccessibilityTests(unittest.TestCase):
    def read(self, relative):
        return (ROOT / relative).read_text()

    def test_bess_dispatch_has_text_alternative_and_non_color_encoding(self):
        html = self.read('results/iberian-bess-policy-challenge/run/index.html')
        css = self.read('results/iberian-bess-policy-challenge/run/surface.css')
        js = self.read('results/iberian-bess-policy-challenge/run/surface.js')
        self.assertIn('aria-describedby="dispatch-chart-summary"', html)
        self.assertIn('aria-describedby="score-chart-summary"', html)
        self.assertIn('storage-charge-hatch', js)
        self.assertIn('fill: url(#storage-charge-hatch)', css)
        self.assertIn('stroke-dasharray: 7 8', css)
        self.assertIn('hatched charge bars below zero', js)

    def test_qubit_accepted_candidate_is_not_color_only(self):
        html = self.read('results/qubit-routing-lightsabre/run/index.html')
        css = self.read('results/qubit-routing-lightsabre/run/surface.css')
        js = self.read('results/qubit-routing-lightsabre/run/surface.js')
        for summary in ('qubit-score-summary', 'qubit-circuit-summary', 'qubit-topology-summary'):
            self.assertIn(f'aria-describedby="{summary}"', html)
        self.assertIn('qubit-run-accepted-diamond', css)
        self.assertIn('qubit-run-accepted-diamond', js)
        self.assertIn('baseline is a circle while the final accepted candidate is a diamond', html)

    def test_rcpsp_visuals_bind_existing_redundant_encodings_to_text(self):
        html = self.read('results/rcpsp-psplib-j30/run/index.html')
        css = self.read('results/rcpsp-psplib-j30/run/surface.css')
        for summary in ('rcpsp-score-summary', 'rcpsp-dispatch-summary', 'rcpsp-gap-summary'):
            self.assertIn(f'aria-describedby="{summary}"', html)
        self.assertIn('rcpsp-gap-hatch-line', css)
        self.assertIn('stroke-dasharray: 3 4', css)
        self.assertIn('rcpsp-schedule-excess-hatch', css)

if __name__ == '__main__':
    unittest.main()
''')
          PY

      - name: Validate source-owned replay accessibility
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_result.py results/*
          python tools/build_catalog.py --check
          git diff --check

      - name: Commit upstream accessibility patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results tests
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(a11y): make replay figures non-color dependent"
          git push origin HEAD:codex/32-replay-figure-accessibility
